name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run smoke tests
        run: pytest tests/ -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: portainer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/photodate:latest
            ghcr.io/${{ github.repository_owner }}/photodate:${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via Portainer API
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          set -euo pipefail
          BASE="${PORTAINER_URL%/}"
          api() { curl --fail-with-body -sS -H "X-API-Key: $PORTAINER_API_TOKEN" "$@"; }

          STACK_INFO=$(api "$BASE/api/stacks/$PORTAINER_STACK_ID")
          ENDPOINT_ID=$(jq -r '.EndpointId' <<<"$STACK_INFO")
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          api -X POST -o /dev/null \
            "$BASE/api/endpoints/$ENDPOINT_ID/docker/images/create?fromImage=ghcr.io%2F${IMAGE_LOWER}&tag=latest"

          # Build the body with jq so the compose file is passed verbatim (no shell quoting).
          jq -n --rawfile compose docker-compose.yml --argjson env "$(jq '.Env // []' <<<"$STACK_INFO")" \
            '{StackFileContent: $compose, Env: $env, Prune: true, PullImage: true}' > stack-update.json
          api -X PUT -o /dev/null -H "Content-Type: application/json" --data @stack-update.json \
            "$BASE/api/stacks/$PORTAINER_STACK_ID?endpointId=$ENDPOINT_ID"
          echo "ENDPOINT_ID=$ENDPOINT_ID" >> "$GITHUB_ENV"
          echo "Stack bijgewerkt."

      - name: Check container runs the new image
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          CONTAINER_NAME: photodate
          APP_PORT: "8920"
        run: |
          set -euo pipefail
          BASE="${PORTAINER_URL%/}"
          api() { curl --fail-with-body -sS -H "X-API-Key: $PORTAINER_API_TOKEN" "$@"; }
          IMAGE_REF=$(echo "ghcr.io/$IMAGE_NAME:latest" | tr '[:upper:]' '[:lower:]' | sed 's#/#%2F#g')
          WANT=$(api "$BASE/api/endpoints/$ENDPOINT_ID/docker/images/$IMAGE_REF/json" | jq -r '.Id')

          STATE=""
          for i in $(seq 1 24); do
            INFO=$(api "$BASE/api/endpoints/$ENDPOINT_ID/docker/containers/json?all=true" \
              | jq -c --arg n "/$CONTAINER_NAME" '[.[] | select(.Names[0] == $n)][0] // {}')
            STATE=$(jq -r '.State // "afwezig"' <<<"$INFO")
            HAVE=$(jq -r '.ImageID // ""' <<<"$INFO")
            echo "poging $i/24: container $STATE"
            if [ "$STATE" = "running" ] && [ "$HAVE" = "$WANT" ]; then break; fi
            sleep 5
          done
          if [ "$STATE" != "running" ]; then echo "::error::Container $CONTAINER_NAME draait niet na de deploy ($STATE)"; exit 1; fi
          if [ "$HAVE" != "$WANT" ]; then echo "::error::Container draait niet op de nieuwe image"; exit 1; fi

          HOST=$(sed -E 's#^(https?://[^:/]+).*#\1#' <<<"$BASE")
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HOST:$APP_PORT/health" || true)
            echo "app poging $i/12: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::App reageert niet op $HOST:$APP_PORT/health"
          exit 1
