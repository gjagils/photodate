[project]
name = "photodate"
version = "0.1.0"
description = "Corrigeer datums van ingescande foto's met AI"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "typer>=0.9.0",
    "piexif>=1.1.3",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "face_recognition>=1.3.0",
    "numpy>=1.24.0",
    "pillow-heif>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
photodate = "photodate.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
